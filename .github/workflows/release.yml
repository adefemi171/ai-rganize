# Create a GitHub Release (with built artifacts) when a version tag is pushed.
# Usage:
#   git tag -a v1.0.0 -m "v1.0.0"
#   git push origin v1.0.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## Install

            **PyPI** (after publish workflow completes):
            ```bash
            uv tool install ai_rganize
            # or: pip install ai_rganize
            ```

            **From this GitHub release / repo:**
            ```bash
            uv tool install "ai_rganize @ git+https://github.com/adefemi171/ai-rganize.git@${{ github.ref_name }}"
            ```

            **Homebrew** (tap):
            ```bash
            brew tap adefemi171/airganize https://github.com/adefemi171/homebrew-airganize
            brew install ai-rganize
            ```

            See [RELEASE_NOTES.md](https://github.com/adefemi171/ai-rganize/blob/main/RELEASE_NOTES.md) for details.
