# Publish to PyPI via Trusted Publishing (OIDC).
# One-time setup: https://pypi.org/manage/account/publishing/
#   - Owner: adefemi171 (or org)
#   - Repository: ai-rganize
#   - Workflow: publish-pypi.yml
#   - Environment name: pypi
#
# Triggered on version tags (not only release:published), because releases created
# with GITHUB_TOKEN do not start other workflows.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (skip upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai_rganize
    permissions:
      id-token: write # for PyPI Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        if: ${{ github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
